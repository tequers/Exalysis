<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaxPool / MaxUnpool Visualizer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #e0e0e0; min-height: 100vh; padding: 20px; }
  h1 { text-align: center; font-size: 20px; color: #fff; margin-bottom: 4px; }
  .subtitle { text-align: center; color: #666; font-size: 13px; margin-bottom: 20px; }

  .steps { display: flex; justify-content: center; gap: 0; margin-bottom: 24px; flex-wrap: wrap; }
  .step-btn { background: #161b22; border: 1px solid #30363d; color: #8b949e; padding: 10px 18px; cursor: pointer; font-size: 13px; transition: all 0.2s; white-space: nowrap; }
  .step-btn:first-child { border-radius: 8px 0 0 8px; }
  .step-btn:last-child { border-radius: 0 8px 8px 0; }
  .step-btn.active { background: #1f6feb; border-color: #1f6feb; color: #fff; z-index: 1; }
  .step-btn:hover:not(.active) { background: #21262d; color: #e0e0e0; }

  .stage { display: flex; align-items: center; justify-content: center; gap: 24px; flex-wrap: wrap; min-height: 280px; }
  .grid-block { text-align: center; }
  .grid-title { font-size: 12px; color: #8b949e; margin-bottom: 10px; letter-spacing: 0.5px; text-transform: uppercase; }
  .grid { display: inline-grid; gap: 4px; }
  .cell {
    width: 56px; height: 56px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; cursor: default;
    transition: transform 0.15s, box-shadow 0.15s;
    position: relative;
  }
  .cell:hover { transform: scale(1.08); z-index: 10; }
  .cell.win-tl { box-shadow: inset 0 0 0 2px #f0b72f; }
  .cell.win-tr { box-shadow: inset 0 0 0 2px #58a6ff; }
  .cell.win-bl { box-shadow: inset 0 0 0 2px #3fb950; }
  .cell.win-br { box-shadow: inset 0 0 0 2px #f85149; }
  .cell.is-max::after {
    content: '★';
    position: absolute;
    top: 2px; right: 4px;
    font-size: 9px;
    color: #fff;
    opacity: 0.8;
  }

  .arrow { font-size: 28px; color: #444; padding: 0 4px; }

  .info-panel {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 10px;
    padding: 16px 20px;
    margin-top: 20px;
    font-size: 13px;
    line-height: 1.7;
    max-width: 720px;
    margin-left: auto;
    margin-right: auto;
  }
  .info-panel h3 { color: #58a6ff; margin-bottom: 8px; font-size: 14px; }
  .info-panel code { background: #21262d; padding: 1px 6px; border-radius: 4px; font-size: 12px; color: #79c0ff; }

  .legend { display: flex; gap: 16px; justify-content: center; margin: 14px 0; flex-wrap: wrap; }
  .leg { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #8b949e; }
  .leg-box { width: 16px; height: 16px; border-radius: 3px; border: 2px solid; }

  .idx-badge {
    position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
    font-size: 9px; font-weight: 400; color: rgba(255,255,255,0.6);
    white-space: nowrap;
  }

  .compare-row { display: flex; gap: 32px; justify-content: center; flex-wrap: wrap; align-items: flex-start; }
  .compare-label { font-size: 11px; color: #8b949e; text-align: center; margin-top: 8px; }

  .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-right: 6px; }
  .tag-precise { background: #1a3a1a; color: #3fb950; }
  .tag-blurry { background: #3a1a1a; color: #f85149; }
</style>
</head>
<body>

<h1>MaxPool → MaxUnpool</h1>
<p class="subtitle">Click each step to walk through the algorithm</p>

<div class="steps">
  <button class="step-btn active" onclick="go(0)">① Input + Windows</button>
  <button class="step-btn" onclick="go(1)">② MaxPooling</button>
  <button class="step-btn" onclick="go(2)">③ Saved Indices</button>
  <button class="step-btn" onclick="go(3)">④ MaxUnpooling</button>
  <button class="step-btn" onclick="go(4)">⑤ Compare Methods</button>
</div>

<div class="legend">
  <div class="leg"><div class="leg-box" style="border-color:#f0b72f;background:#2a2400"></div>Window TL</div>
  <div class="leg"><div class="leg-box" style="border-color:#58a6ff;background:#001a3a"></div>Window TR</div>
  <div class="leg"><div class="leg-box" style="border-color:#3fb950;background:#001a10"></div>Window BL</div>
  <div class="leg"><div class="leg-box" style="border-color:#f85149;background:#3a0000"></div>Window BR</div>
  <div class="leg" style="margin-left:8px">★ = max value kept</div>
</div>

<div class="stage" id="stage"></div>
<div class="info-panel" id="info"></div>

<script>
const INPUT = [[3,1,8,2],[6,2,4,5],[2,7,1,3],[1,4,9,2]];

// window assignments: [winClass, isMax]
const WIN_ASSIGN = [
  ['win-tl','win-tr','win-tr','win-tr'],
  ['win-tl','win-tl','win-tr','win-tr'],
  ['win-bl','win-bl','win-br','win-br'],
  ['win-bl','win-bl','win-br','win-br'],
];
const IS_MAX = (r,c) => (r===1&&c===0)||(r===0&&c===2)||(r===2&&c===1)||(r===3&&c===2);

const POOLED = [[6,8],[7,9]];
const MAX_POS = [[1,0],[0,2],[2,1],[3,2]]; // absolute positions of maxima

// Unpooled: zeros + max values at saved positions
const UNPOOLED = Array(4).fill(null).map(()=>Array(4).fill(0));
MAX_POS.forEach(([r,c],i)=>{ UNPOOLED[r][c] = POOLED[Math.floor(i/2)][i%2]; });

// Nearest neighbor
const NN = [[6,6,8,8],[6,6,8,8],[7,7,9,9],[7,7,9,9]];

function valToColor(v, max=9, alpha=1) {
  const t = v/max;
  return `rgba(${Math.round(20+t*60)},${Math.round(40+t*120)},${Math.round(80+t*160)},${alpha})`;
}

function makeGrid(data, opts={}) {
  const { showWindows=false, showMax=false, showIdx=false, highlight=null, sparse=false, nn=false } = opts;
  const n = data.length, m = data[0].length;
  let h = `<div class="grid" style="grid-template-columns:repeat(${m},56px)">`;
  for (let r=0;r<n;r++) {
    for (let c=0;c<m;c++) {
      const v = data[r][c];
      let cls = 'cell';
      if (showWindows) cls += ' ' + WIN_ASSIGN[r][c];
      if (showMax && IS_MAX(r,c)) cls += ' is-max';
      let bg = valToColor(v);
      let color = '#fff';
      if (sparse && v===0 && !IS_MAX(r,c)) { bg='#0d1117'; color='#333'; }
      if (highlight) {
        const found = highlight.find(([hr,hc])=>hr===r&&hc===c);
        if (found) bg = '#1f6feb';
      }
      if (nn) bg = valToColor(v, 9, 0.7);
      let inner = `<span>${v===0&&sparse?'·':v}</span>`;
      if (showIdx && IS_MAX(r,c)) {
        inner += `<span class="idx-badge">r${r}c${c}</span>`;
      }
      h += `<div class="${cls}" style="background:${bg};color:${color}">${inner}</div>`;
    }
  }
  return h + '</div>';
}

function block(title, gridHtml) {
  return `<div class="grid-block"><div class="grid-title">${title}</div>${gridHtml}</div>`;
}

const STEPS = [
  {
    render() {
      return `<div class="stage">${
        block('4×4 Input Feature Map', makeGrid(INPUT, {showWindows:true, showMax:true}))
      }</div>`;
    },
    info: `<h3>① The input + 2×2 windows</h3>
The 4×4 feature map is divided into four non-overlapping 2×2 windows (colour-coded).
Within each window, the ★ marks the maximum value.<br><br>
MaxPooling will keep only that one value per window → output is 2×2.<br><br>
<strong>Key question:</strong> where exactly did the max come from? That position needs to be saved.`
  },
  {
    render() {
      return `<div class="stage">${
        block('4×4 Input', makeGrid(INPUT, {showWindows:true, showMax:true}))
      }<div class="arrow">→</div>${
        block('2×2 Pooled output', makeGrid(POOLED, {}))
      }</div>`;
    },
    info: `<h3>② MaxPooling</h3>
Each 2×2 window → one output cell (the max). Spatial size: 4×4 → 2×2. ½ the width, ½ the height.<br><br>
The pooled map is compact and rich — but we've lost <em>where inside each window</em> the max came from.
That information is saved separately as 4 (row, col) indices — one per window.`
  },
  {
    render() {
      return `<div class="stage">${
        block('4×4 Input — saved positions', makeGrid(INPUT, {showWindows:true, showMax:true, showIdx:true}))
      }<div style="display:flex;flex-direction:column;gap:10px;padding-top:20px">
        <div style="font-size:12px;color:#8b949e;text-align:left">Receipts saved during pooling:</div>
        ${[['TL','#f0b72f','6','r1, c0'],['TR','#58a6ff','8','r0, c2'],['BL','#3fb950','7','r2, c1'],['BR','#f85149','9','r3, c2']]
          .map(([w,col,v,pos])=>`<div style="font-size:13px;display:flex;align-items:center;gap:8px">
            <div style="width:12px;height:12px;border-radius:2px;background:${col};opacity:0.7"></div>
            <span style="color:#8b949e">Win ${w}:</span>
            <span style="color:#fff;font-weight:700">max=${v}</span>
            <span style="color:#8b949e">at ${pos}</span>
          </div>`).join('')}
      </div></div>`;
    },
    info: `<h3>③ Saved indices (the "receipts")</h3>
For each window, we store the <strong>absolute position</strong> (row, col) of the max in the original 4×4 grid.<br><br>
These 4 position receipts are passed down to the decoder. Memory cost: tiny — just 4 coordinates.<br><br>
Without these, the decoder cannot know <em>where</em> to place each value → boundaries become blurry.`
  },
  {
    render() {
      return `<div class="stage">${
        block('2×2 Pooled', makeGrid(POOLED, {}))
      }<div class="arrow">→</div>${
        block('4×4 MaxUnpooled', makeGrid(UNPOOLED, {sparse:true, highlight:MAX_POS}))
      }</div>`;
    },
    info: `<h3>④ MaxUnpooling</h3>
Each pooled value is placed back at its <strong>exact saved position</strong>. Every other cell gets zero (shown as ·).<br><br>
Result: sparse (lots of zeros) but <strong>spatially precise</strong>. The decoder's conv layer then fills in the zeros.<br><br>
<strong>Your question — "doesn't it fragment the dog?"</strong><br>
Yes, it's sparse. But: (1) the conv after unpooling smooths and fills gaps, and (2) the skip connection from the encoder brings in the original high-res feature map at this resolution, which provides the context to fill in correctly.
The zeros don't stay zeros — they get context from neighbouring activations after convolution.`
  },
  {
    render() {
      return `<div class="compare-row">
        <div>${block('MaxUnpool', makeGrid(UNPOOLED, {sparse:true, highlight:MAX_POS}))}<div class="compare-label"><span class="tag tag-precise">PRECISE</span>sparse → conv fills gaps</div></div>
        <div style="display:flex;align-items:center;padding-top:40px;font-size:20px;color:#444">vs</div>
        <div>${block('Nearest-neighbor', makeGrid(NN, {nn:true}))}<div class="compare-label"><span class="tag tag-blurry">BLURRY</span>fills 2×2 block uniformly</div></div>
      </div>`;
    },
    info: `<h3>⑤ MaxUnpool vs Nearest-Neighbor upsampling</h3>
<strong style="color:#3fb950">MaxUnpool:</strong> values return to their exact origin → sharp, but sparse. A convolution + skip connection complete the reconstruction.<br><br>
<strong style="color:#f85149">Nearest-neighbor:</strong> each pooled value fills the whole 2×2 block → smooth, but the spatial precision is lost. Boundaries end up blurry because we don't know the original positions.<br><br>
This is why segmentation networks (U-Net, SegNet) use MaxUnpool + skip connections rather than naive upsampling — they need precise pixel-level boundaries.`
  }
];

function go(i) {
  document.querySelectorAll('.step-btn').forEach((b,j)=>b.classList.toggle('active',i===j));
  document.getElementById('stage').innerHTML = STEPS[i].render();
  document.getElementById('info').innerHTML = STEPS[i].info;
}

go(0);
</script>
</body>
</html>
